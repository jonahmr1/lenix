<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .radio {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-direction: row-reverse;
      animation: fadeInUp 0.8s ease-out;
    }

    .radio > input {
      position: absolute;
      appearance: none;
    }

    .radio > label {
      cursor: pointer;
      font-size: 30px;
      position: relative;
      display: inline-block;
    }

    .radio > label:nth-child(2) { animation-delay: 0.1s; }
    .radio > label:nth-child(4) { animation-delay: 0.2s; }
    .radio > label:nth-child(6) { animation-delay: 0.3s; }
    .radio > label:nth-child(8) { animation-delay: 0.4s; }
    .radio > label:nth-child(10) { animation-delay: 0.5s; }

    .radio > label > svg {
      fill: #9b9b9b;
      transition: fill 0.3s ease;
    }

    .radio > label::before,
    .radio > label::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #ff9e0b;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition:
        transform 0.4s ease,
        opacity 0.4s ease;
      animation: particle-explosion 1s ease-out;
    }

    .radio > label::before {
      top: -15px;
      left: 50%;
      transform: translateX(-50%) scale(0);
    }

    .radio > label::after {
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%) scale(0);
    }

    .radio > label:hover::before,
    .radio > label:hover::after {
      opacity: 1;
      transform: translateX(-50%) scale(1.5);
    }

    .radio > label:hover {
      animation: none;
    }

    .radio > label:hover > svg,
    .radio > label:hover ~ label > svg {
      fill: #ff9e0b;
      filter: drop-shadow(0 0 15px rgba(255, 158, 11, 0.9));
      animation: shimmer 1s ease infinite alternate;
    }

    .radio > input:checked + label > svg,
    .radio > input:checked + label ~ label > svg {
      fill: #ff9e0b;
      filter: drop-shadow(0 0 15px rgba(255, 158, 11, 0.9));
      animation: pulse 0.8s infinite alternate;
    }

    .radio > input:checked + label {
      animation: starBurst 0.6s ease-out;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.1);
      }
    }

    @keyframes starBurst {
      0% {
        transform: scale(1) rotate(0deg);
      }
      50% {
        transform: scale(1.4) rotate(180deg);
      }
      100% {
        transform: scale(1) rotate(360deg);
      }
    }

    @keyframes particle-explosion {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
      100% {
        opacity: 0;
        transform: scale(0.5);
      }
    }

    @keyframes shimmer {
      0% {
        filter: drop-shadow(0 0 10px rgba(255, 158, 11, 0.5));
      }
      100% {
        filter: drop-shadow(0 0 20px rgba(255, 158, 11, 1));
      }
    }

    .radio > input:checked + label:hover > svg,
    .radio > input:checked + label:hover ~ label > svg {
      fill: #e58e09;
    }

    .radio > label:hover > svg,
    .radio > label:hover ~ label > svg {
      fill: #ff9e0b;
    }

    .radio input:checked ~ label svg {
      fill: #ffa723;
    }

  </style>
</head>
<body>
  <div id="root">
    <div class="app"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
