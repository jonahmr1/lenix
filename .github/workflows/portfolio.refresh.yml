name: Refresh Data
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Run fetch script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bun --env-file=.env scripts/fetch.ts
