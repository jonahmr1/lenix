<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

    <!-- ======================== -->
    <!-- 🎬 فيديو الخلفية          -->
    <!-- ======================== -->
    <video id="bgVideo" autoplay muted loop playsinline preload="auto">
        <source src="assets/video/background.mp4" type="video/mp4">
        المتصفح لا يدعم تشغيل الفيديو.
    </video>

    <!-- ======================== -->
    <!-- 🌑 طبقة التعتيم فوق الفيديو -->
    <!-- ======================== -->
    <div id="overlay"></div>

    <!-- ======================== -->
    <!-- 📺 تراكب خطوط المسح      -->
    <!-- ======================== -->
    <div class="scanlines"></div>

    <!-- ======================== -->
    <!-- 📦 المحتوى الرئيسي        -->
    <!-- ======================== -->
    <div id="mainContainer">

        <!-- ====== أقصى اليمين: معلومات السيرفر ====== -->
        <div id="rightSection">
            <div id="serverInfo">

                <!-- اسم السيرفر -->
                <div id="serverNameWrapper">
                    <h1 id="serverName"></h1>
                    <div class="server-subtitle">Loading Screen</div>
                    <div class="title-underline"></div>
                </div>

                <!-- البطاقات -->
                <div id="infoCards">
                    <!-- Owner -->
                    <div class="info-card">
                        <div class="card-icon">
                            <img id="ownerImg" class="card-person-img" src="" alt="">
                            <svg id="ownerIcon" class="card-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-label">Owner</span>
                            <span class="card-value" id="ownerName"></span>
                        </div>
                    </div>

                    <!-- Co-Owner -->
                    <div class="info-card">
                        <div class="card-icon">
                            <img id="coOwnerImg" class="card-person-img" src="" alt="">
                            <svg id="coOwnerIcon" class="card-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-label">Co-Owner</span>
                            <span class="card-value" id="coOwnerName"></span>
                        </div>
                    </div>

                    <!-- Developer -->
                    <div class="info-card">
                        <div class="card-icon">
                            <img id="developerImg" class="card-person-img" src="" alt="">
                            <svg id="developerIcon" class="card-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-label">Developer</span>
                            <span class="card-value" id="developerName"></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ====== أقصى اليسار تحت: اللوجو + زر الوصف ====== -->
        <div id="leftSection">
            <div id="descArea">
                <button id="descBtn">الوصف</button>
                <div id="descText"></div>
                <button id="linksBtn">الروابط</button>
                <div id="linksIcons">
                    <span id="copyMsg">تم النسخ ✓</span>
                    <a id="discordLink" href="#" title="Discord">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="#5865F2">
                            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.054C1.482 8.154.834 11.82 1.158 15.418a.084.084 0 0 0 .031.057 19.869 19.869 0 0 0 5.98 3.023.075.075 0 0 0 .081-.027 14.038 14.038 0 0 0 1.224-1.99.073.073 0 0 0-.04-.1 13.183 13.183 0 0 1-1.871-.892.077.077 0 0 1-.008-.128 9.38 9.38 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.24 12.24 0 0 1-1.873.892.077.077 0 0 0-.041.099c.357.698.789 1.352 1.224 1.99.018.024.052.031.08.026a19.836 19.836 0 0 0 5.981-3.023.077.077 0 0 0 .032-.054c.384-4.122-.645-7.756-2.828-10.993a.06.06 0 0 0-.033-.054zM8.02 12.85c-.975 0-1.775-.89-1.775-1.985s.784-1.985 1.775-1.985c.992 0 1.792.89 1.775 1.985.016 1.095-.783 1.985-1.775 1.985zm7.96 0c-.975 0-1.775-.89-1.775-1.985s.784-1.985 1.775-1.985c.992 0 1.792.89 1.775 1.985 0 1.095-.783 1.985-1.775 1.985z"/>
                        </svg>
                    </a>
                </div>
            </div>
            <div id="logoWrapper">
                <img id="serverLogo" src="" alt="Server Logo">
            </div>
        </div>

    </div>

    <!-- ======================== -->
    <!-- 🎵 ملف الصوت المنفصل     -->
    <!-- ======================== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/audio/music.mp3" type="audio/mpeg">
        المتصفح لا يدعم تشغيل الصوت.
    </audio>

    <!-- ======================== -->
    <!-- 🔊 أزرار تشغيل / إيقاف الصوت -->
    <!-- ======================== -->
    <div id="musicControls">
        <button id="playBtn" class="music-btn">تشغيل</button>
        <button id="stopBtn" class="music-btn">إيقاف</button>
    </div>

    <!-- ======================== -->
    <!-- 📊 شريط التحميل (تحت)     -->
    <!-- ======================== -->
    <div id="loadingBarContainer">
        <div id="loadingBarTrack">
            <div id="loadingBarFill"></div>
        </div>
        <div id="loadingPercentage">0%</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
